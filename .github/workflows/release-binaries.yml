name: Release Desktop Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
        app:
          - name: client
            path: apps/client
          - name: server
            path: apps/server

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            librsvg2-dev \
            patchelf

      - name: Install workspace dependencies
        run: npm ci

      - name: Build and upload ${{ matrix.app.name }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ matrix.app.path }}
          args: --target ${{ matrix.platform.target }}
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          releaseName: Modbus Lab ${{ github.event.release.tag_name || github.ref_name }}
          releaseBody: |
            Automated release for ${{ github.event.release.tag_name || github.ref_name }}.

            Includes Tauri desktop binaries for:
            - Client app (Windows, macOS, Linux)
            - Server app (Windows, macOS, Linux)
            - macOS targets: Intel (x86_64) and Apple Silicon (aarch64)
          releaseDraft: true
          prerelease: false

  publish-release:
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - name: Fail fast if release was already published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')
          if [ "$DRAFT" != "true" ]; then
            echo "::error::Release $TAG_NAME was published before CI finished. Aborting to prevent incomplete uploads."
            exit 1
          fi

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG_NAME" --draft=false

  cleanup-failed-draft:
    needs: build-and-upload
    if: ${{ always() && needs.build-and-upload.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release for failed tag build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "No release found for $TAG_NAME. Nothing to clean up."
            exit 0
          fi

          DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')
          if [ "$DRAFT" = "true" ]; then
            gh release delete "$TAG_NAME" --yes
            echo "Deleted draft release for failed build: $TAG_NAME"
          else
            echo "Release $TAG_NAME is already published. Skipping cleanup."
          fi
