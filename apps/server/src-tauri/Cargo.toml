[package]
name = "modbus-lab-server"
version = "0.0.7"
description = "ModbusLab Client desktop application"
authors = ["Raghav"]
license = "../../../LICENSE"
repository = ""
edition = "2021"

[lib]
name = "app_server_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mbus-core = { version = "0.8.0", default-features = false, features = [
    "coils",
    "discrete-inputs",
    "registers",
    "diagnostics",
    "fifo",
    "file-record",
] }
modbus-rs = { version = "0.8.0", features = [
    "async",
    "client",
    "server",
    "network-tcp",
    "coils",
    "discrete-inputs",
    "registers",
    "holding-registers",
    "input-registers",
    "fifo",
    "file-record",
    "diagnostics",
    "traffic",
] }
tokio = { version = "1", features = [
    "io-util",
    "net",
    "sync",
    "rt-multi-thread",
    "macros",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
serialport = "4"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
ibus-core = { path = "../../../crates/ibus-core" }
